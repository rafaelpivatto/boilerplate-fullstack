services:
  db:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - project-postgres:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-app-user.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d project']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/project
      API_PORT: 3001
      JWT_SECRET: local-development-secret
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    environment:
      API_INTERNAL_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  project-postgres:
